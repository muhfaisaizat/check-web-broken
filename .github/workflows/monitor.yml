name: Web Health Monitor

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL yang akan dicek'
        required: true
        default: 'https://portoqu.onrender.com/'

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Monitor Script
        # Tambahkan argumen --url di sini
        run: python monitor.py --url "${{ github.event.inputs.target_url }}"

      - name: Upload Report Image
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-screenshot
          path: screenshot.png
          retention-days: 1